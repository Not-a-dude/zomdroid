name: Build APK

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode Keystore File
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 --decode > app/release.jks

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug
        env:
          GRADLE_OPTS: "-Dorg.gradle.workers.max=2"

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.workers.max=2"
          ZOMDROID_STORE_FILE: "release.jks"
          ZOMDROID_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASS }}
          ZOMDROID_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          ZOMDROID_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASS }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zomdroid-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: zomdroid-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error